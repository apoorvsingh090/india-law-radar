name: Bug report
description: Something in the CLI, ingest, reporting, or web UI misbehaves
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
      placeholder: "`lawradar reports verify <id>` exits 0 despite a broken citation."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `lawradar init`
        2. `lawradar ingest fixture-sample`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. 0.7.0 or commit abc123"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Windows 11, Python 3.12, PowerShell"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, output, or screenshots
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This does not expose real personal/legal data (see SECURITY.md)
          required: true
