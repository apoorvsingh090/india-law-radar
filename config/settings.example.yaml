# India Law Radar — example local settings (Milestone 1).
# Copy to config/settings.yaml via `lawradar init` and edit as needed.
# Environment variables override these values (see .env.example).
environment: local
data_dir: ./data
db_url: sqlite:///./data/lawradar.db
log_level: INFO
log_file: ""
poll_default_minutes: 1440
http_timeout_seconds: 30
http_max_bytes: 50000000
# Review policy (Milestone 4): only 'manual' — reports stay unpublished
# until a human runs `lawradar review <id> --approve`.
review_policy: manual
# Optional AI summariser (Milestone 4): off by default. Core works without it.
# To enable, set ai_enabled: true and ai_command to a local executable that
# reads {system, draft, evidence} JSON on stdin and writes
# {summary, claims, warnings} JSON on stdout. Model output is validated;
# malformed output or invented citations are rejected, never repaired.
ai_enabled: false
ai_command: ""
# Public-beta guards (Milestone 7): max state-changing POSTs per client IP
# per minute. `serve` still refuses non-loopback binds without --token.
post_limit_per_minute: 30
